<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Promtsal: messy prompt in, clear prompt out">
  <rect width="1280" height="400" fill="#eceff3"/>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="78" y="182" font-size="92" font-weight="700" fill="#17202c" letter-spacing="-2">Promt<tspan fill="#2450c0">sal</tspan></text>
    <text x="82" y="246" font-size="30" font-weight="600" fill="#17202c">Messy prompt in. Clear prompt out.</text>
    <text x="82" y="290" font-size="21" fill="#586374">Cleans up, strengthens, and asks instead of guessing.</text>
    <text x="82" y="322" font-size="21" fill="#586374">Turkish + English · Gemini or Claude · no server</text>
  </g>
  <g transform="translate(700 55)">
    <rect width="510" height="290" rx="16" fill="#ffffff" stroke="#d4dae2"/>
    <g font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="17">
      <text x="28" y="44" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#586374">BEFORE</text>
      <text x="28" y="74" fill="#586374"><tspan fill="#b13a2b" text-decoration="line-through">so</tspan> i want you to <tspan fill="#b13a2b" text-decoration="line-through">like</tspan> make me a</text>
      <text x="28" y="100" fill="#586374">script that <tspan fill="#b13a2b" text-decoration="line-through">kind of</tspan> renames my photos</text>
      <text x="28" y="126" fill="#586374">by the date taken <tspan fill="#b13a2b" text-decoration="line-through">or something</tspan></text>
      <line x1="28" y1="150" x2="482" y2="150" stroke="#d4dae2"/>
      <text x="28" y="182" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#2450c0">AFTER</text>
      <text x="28" y="212" fill="#17202c">Write a script that renames every</text>
      <text x="28" y="238" fill="#17202c">photo in a folder by the date taken.</text>
      <text x="28" y="262" fill="#16674a" font-size="15">? Which language: PowerShell or Python?</text>
    </g>
  </g>
</svg>
